name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make check
      - run: make lint
      - name: Formatting is clean
        run: |
          make format
          test -z "$(git status --porcelain)" || { git status --short; git diff | head -50; echo "run 'make format' and commit"; exit 1; }
      - name: Package manifests are up to date
        run: |
          make manifests
          test -z "$(git status --porcelain)" || { git status --short; echo "run 'make manifests' and commit"; exit 1; }
