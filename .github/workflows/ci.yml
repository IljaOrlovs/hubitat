name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: build/gradle-home
          key: gradle-${{ hashFiles('build.gradle', 'settings.gradle') }}
          restore-keys: gradle-
      - run: make coverage
      - run: make lint
      - name: Formatting is clean
        run: |
          make format
          test -z "$(git status --porcelain)" || { git status --short; git diff | head -50; echo "run 'make format' and commit"; exit 1; }
      - name: Package manifests are up to date
        run: |
          make manifests
          test -z "$(git status --porcelain)" || { git status --short; echo "run 'make manifests' and commit"; exit 1; }
